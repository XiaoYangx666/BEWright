[package]
name = "blockwright-world"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Our fork carries the single-pass region export (upstream is not used).
bedrock-world = { git = "https://github.com/XiaoYangx666/bedrock-world.git", branch = "main", default-features = false, features = ["backend-bedrock-leveldb"] }
serde_json = "1"
indexmap = "2"
bedrock-leveldb = { version = "0.4.0", git = "https://github.com/XiaoYangx666/bedrock-leveldb.git", branch = "main", default-features = false, features = ["zlib"] }
anvil-nbt = "0.2.0"
flate2 = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
